<!--
  Synthetic, portal-agnostic fixture for src/portals/base.py's
  set_file_input()/wait_for_dependent_option() helpers ONLY.

  This is NOT modeled on any recording of the Gujarat UDISE or National
  UDISE+ portals — no such recording exists for either a file-upload
  screen or a dependent-dropdown delay (see base.py's docstring). It
  exists purely to prove the two generic Playwright helpers work, in
  isolation from any real adapter.
-->
<!DOCTYPE html>
<html>
<body>
  <label for="upload">Upload Document</label>
  <input type="file" id="upload" />

  <label for="state">State</label>
  <select id="state">
    <option value="">-- select --</option>
    <option value="OD">Odisha</option>
    <option value="GJ">Gujarat</option>
  </select>

  <label for="district">District</label>
  <select id="district">
    <option value="">-- select a state first --</option>
  </select>

  <script>
    document.getElementById('state').addEventListener('change', function (e) {
      var district = document.getElementById('district');
      district.innerHTML = '<option value="">-- select --</option>';
      // Simulate an async fetch of dependent options.
      setTimeout(function () {
        var options = e.target.value === 'OD'
          ? ['GANJAM', 'PURI']
          : ['AHMEDABAD', 'SURAT'];
        options.forEach(function (name) {
          var opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          district.appendChild(opt);
        });
      }, 300);
    });
  </script>
</body>
</html>
