<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>National UDISE+ — Mock Fixture (New PEN Entry / PEN Import)</title>
</head>
<body>

<div id="global-nav" hidden>
  <button type="button" id="nav-release-management-btn">Student Release Request Management</button>
</div>
<main id="app"></main>

<!-- Each screen lives in its own <template> and is swapped into #app one
     at a time (never left in the DOM hidden) — this fixture stands in for
     several distinct real portal pages that legitimately reuse label text
     ("Student Name", "Student PEN", etc.); toggling `hidden` on sibling
     sections instead would leave every screen's form controls in the DOM
     simultaneously and make get_by_label ambiguous (Playwright's label
     matching, unlike get_by_role, is not visibility-filtered). -->

<template id="tpl-login">
  <section>
    <label for="username">Username</label>
    <input id="username" type="text">
    <label for="password">Password</label>
    <input id="password" type="password">
    <button id="login-btn" type="button">Login</button>
  </section>
</template>

<template id="tpl-init">
  <section>
    <label for="init-class">Class</label>
    <select id="init-class">
      <option value="">--</option>
      <option value="lkg">LKG/KG1/PP2</option>
    </select>

    <label for="init-section">Section</label>
    <select id="init-section">
      <option value="">--</option>
      <option value="a">A</option>
    </select>

    <label for="init-name">Student Name</label>
    <input id="init-name" type="text">

    <button type="button" id="add-new-student-btn">Add New Student</button>

    <div id="init-success" hidden>
      <p>The Student has been initialised/Saved Successfully.</p>
      <button type="button" id="fill-general-profile-btn">Fill General Profile</button>
    </div>

    <hr>
    <label for="check-aadhaar-availability">Check AADHAAR Number Availability</label>
    <input type="checkbox" id="check-aadhaar-availability">

    <label for="aadhaar-number">Aadhaar Number</label>
    <input id="aadhaar-number" type="text">

    <button type="button" id="aadhaar-go-btn">Go</button>

    <div id="aadhaar-registered" hidden>
      <p>AADHAAR number is already registered with some other student</p>
      <button type="button" id="view-details-btn">View Details</button>
    </div>
    <div id="aadhaar-not-registered" hidden>No existing registration found.</div>
  </section>
</template>

<template id="tpl-release-menu">
  <section>
    <h2>Student Release Request Management</h2>
    <button type="button" id="release-generate-nav-btn">Generate Student Release Request Within State</button>
    <button type="button" id="release-approve-nav-btn">Approve Student Release Request(s) Within State</button>
    <button type="button" id="release-inbox-nav-btn">View Student Release Request(s) Within State (Inbox)</button>
    <button type="button" id="release-sent-nav-btn">View Student Release Request(s) Within State (Sent)</button>
  </section>
</template>

<template id="tpl-release-generate">
  <section>
    <label for="rel-pen">PEN</label>
    <input id="rel-pen" type="text">
    <label for="rel-dob">DOB</label>
    <input id="rel-dob" type="text">
    <button type="button" id="rel-get-details-btn">Get Details</button>

    <div id="rel-basic-details" hidden>
      <h3>Student Basic Details</h3>
      <label for="rel-udise-code">UDISE Code</label>
      <input id="rel-udise-code" type="text" value="24224100067" readonly>
      <label for="rel-school-name">School Name</label>
      <input id="rel-school-name" type="text" value="Satyam Stars International School" readonly>
      <label for="rel-student-name">Student Name</label>
      <input id="rel-student-name" type="text" value="Test Release Student" readonly>
      <label for="rel-gender">Gender</label>
      <input id="rel-gender" type="text" value="Female" readonly>
      <label for="rel-state-code">Student State Code</label>
      <input id="rel-state-code" type="text" value="24" readonly>
      <label for="rel-mother-name">Mother's Name</label>
      <input id="rel-mother-name" type="text" value="Test Mother" readonly>
      <label for="rel-father-name">Father's Name</label>
      <input id="rel-father-name" type="text" value="Test Father" readonly>
      <label for="rel-aadhaar-no">Aadhaar No.</label>
      <input id="rel-aadhaar-no" type="text" value="999988887777" readonly>
      <label for="rel-name-aadhaar">Name as per Aadhaar</label>
      <input id="rel-name-aadhaar" type="text" value="Test Release Student" readonly>
      <label for="rel-aadhaar-status">Aadhaar Capture Status</label>
      <input id="rel-aadhaar-status" type="text" value="Captured" readonly>

      <h3>Student Admission Detail</h3>
      <label for="rel-class">Class</label>
      <select id="rel-class">
        <option value="">--</option>
        <option value="lkg">LKG/KG1/PP2</option>
      </select>
      <label for="rel-section">Section</label>
      <select id="rel-section">
        <option value="">--</option>
        <option value="a">A</option>
      </select>
      <label for="rel-admission-date">Date of Admission</label>
      <input id="rel-admission-date" type="text">
      <label for="rel-remark">Select Remark</label>
      <select id="rel-remark">
        <option value="">--</option>
        <option value="release">Please release the student from the school records</option>
      </select>

      <button type="button" id="rel-generate-btn">Generate Student Release Request</button>

      <div id="rel-confirm-dialog" hidden>
        <p>Confirm Release Request</p>
        <button type="button" id="rel-cancel-btn">Cancel</button>
        <button type="button" id="rel-confirm-btn">Confirm</button>
      </div>

      <div id="rel-success" hidden>
        <p>Release Request successfully generated</p>
        <label for="rel-request-no">Request No.</label>
        <input id="rel-request-no" type="text" value="SR/GJ/GJ/305364710" readonly>
      </div>
    </div>
  </section>
</template>

<template id="tpl-sent-requests">
  <section>
    <h3>Inbox (Request List) (All Requests)</h3>
    <table>
      <tbody>
        <tr>
          <td>1</td>
          <td>SR/GJ/GJ/305364710</td>
          <td>Satyam Stars International School</td>
          <td>Other School, Ganjam</td>
          <td>NA</td>
          <td>Pending at Destination</td>
          <td><button type="button" id="student-details-btn">Student Details</button></td>
        </tr>
      </tbody>
    </table>

    <div id="student-details-modal" hidden>
      <h3>Student Details (At the time the request was generated)</h3>
      <label for="sd-request-no">Request No.</label>
      <input id="sd-request-no" type="text" value="SR/GJ/GJ/305364710" readonly>
      <label for="sd-pen">PEN</label>
      <input id="sd-pen" type="text" value="23428960733" readonly>
      <label for="sd-student-name">Student Name</label>
      <input id="sd-student-name" type="text" value="Test Release Student" readonly>
      <label for="sd-mother-name">Mother's Name</label>
      <input id="sd-mother-name" type="text" value="Test Mother" readonly>
      <label for="sd-dob">DOB</label>
      <input id="sd-dob" type="text" value="03/02/2022" readonly>
      <label for="sd-father-name">Father's Name</label>
      <input id="sd-father-name" type="text" value="Test Father" readonly>
      <label for="sd-class">Class</label>
      <input id="sd-class" type="text" value="LKG/KG1/PP2" readonly>
    </div>
  </section>
</template>

<template id="tpl-general">
  <section>
    <label for="guardian-name">Guardian's Name</label>
    <input id="guardian-name" type="text">

    <label for="mother-tongue">Mother Tongue of Student</label>
    <input id="mother-tongue" type="text">

    <button type="button" id="general-next-btn">Next</button>

    <!-- Consent dialog: only shown if the fixture is toggled to require it -->
    <div id="consent-dialog" hidden>
      <p>CONSENT FOR DEMOGRAPHIC AUTHENTICATION</p>
      <button type="button" id="i-agree-btn">I Agree</button>
    </div>
  </section>
</template>

<template id="tpl-enrolment">
  <section>
    <label for="admission-no">Admission Number in Present School</label>
    <input id="admission-no" type="text">

    <button type="button" role="button" aria-label="Next" id="enrolment-next-btn">Next</button>
  </section>
</template>

<template id="tpl-facility">
  <section>
    <label for="height">Student's Height (in CMS)</label>
    <input id="height" type="text">

    <label for="weight">Student's Weight (in KGS)</label>
    <input id="weight" type="text">

    <button type="button" role="button" aria-label="Next" id="facility-next-btn">Next</button>
  </section>
</template>

<template id="tpl-preview">
  <section>
    <p>Data completion is complete.</p>
    <button type="button" id="okay-btn">Okay</button>
  </section>
</template>

<template id="tpl-track-by-details">
  <section>
    <h2>Track By Details</h2>

    <label for="track-pen">Student PEN</label>
    <input id="track-pen" type="text" value="12345678901" readonly>

    <label for="track-name">Student Name</label>
    <input id="track-name" type="text" value="Existing Other-School Student" readonly>

    <label for="track-udise">UDISE Code</label>
    <input id="track-udise" type="text" value="24224100099" readonly>

    <label for="track-school-name">School Name</label>
    <input id="track-school-name" type="text" value="Other School, Ganjam" readonly>

    <button type="button" id="global-search-nav-btn">Global Student Search</button>
  </section>
</template>

<template id="tpl-global-search">
  <section>
    <span>Global Student Search</span>

    <label for="gs-mode-pen">Student PEN</label>
    <input type="checkbox" id="gs-mode-pen">

    <label for="gs-pen">PEN</label>
    <input id="gs-pen" type="text">

    <button type="button" id="gs-search-btn">Search</button>

    <div id="gs-result" hidden>
      <label for="gs-student-name">Student Name</label>
      <input id="gs-student-name" type="text" value="Existing Other-School Student" readonly>

      <label for="gs-student-status">Student Status</label>
      <input id="gs-student-status" type="text" value="ACTIVE" readonly>

      <label for="gs-school-details">School Details</label>
      <input id="gs-school-details" type="text" value="Other School, Ganjam" readonly>

      <label for="gs-school-udise">School UDISE</label>
      <input id="gs-school-udise" type="text" value="24224100099" readonly>

      <button type="button" id="hos-details-btn">HOS Details</button>
    </div>

    <div id="hos-details-modal" hidden>
      <h2>HOS Details</h2>
      <label for="hos-state">State</label>
      <input id="hos-state" type="text" value="Odisha" readonly>

      <label for="hos-district">District</label>
      <input id="hos-district" type="text" value="Ganjam" readonly>

      <label for="hos-block">Block</label>
      <input id="hos-block" type="text" value="Sheragada" readonly>

      <label for="hos-name">Headmaster/Principal</label>
      <input id="hos-name" type="text" value="Test HOS Name" readonly>

      <label for="hos-contact">Contact No.</label>
      <input id="hos-contact" type="text" value="9000000000" readonly>
    </div>
  </section>
</template>

<script>
  var REQUIRE_CONSENT = new URLSearchParams(window.location.search).get('consent') === '1';
  var app = document.getElementById('app');

  function show(name) {
    var tpl = document.getElementById('tpl-' + name);
    app.innerHTML = '';
    app.appendChild(tpl.content.cloneNode(true));
  }

  show('login');

  // Attached to <body>, not #app, so the persistent #global-nav button
  // (outside #app — it must stay reachable no matter which screen the
  // single-page swap put into #app) is covered by the same listener.
  document.body.addEventListener('click', function (e) {
    var id = e.target && e.target.id;
    if (!id) return;

    switch (id) {
      case 'login-btn':
        show('init');
        document.getElementById('global-nav').hidden = false;
        break;
      case 'add-new-student-btn':
        document.getElementById('init-success').hidden = false;
        break;
      case 'fill-general-profile-btn':
        show('general');
        break;
      case 'general-next-btn':
        if (REQUIRE_CONSENT && document.getElementById('consent-dialog').hidden) {
          document.getElementById('consent-dialog').hidden = false;
          return; // do NOT advance — the real portal blocks here until consent
        }
        show('enrolment');
        break;
      case 'i-agree-btn':
        document.getElementById('consent-dialog').hidden = true;
        show('enrolment');
        break;
      case 'enrolment-next-btn':
        show('facility');
        break;
      case 'facility-next-btn':
        show('preview');
        break;
      case 'okay-btn':
        app.innerHTML = '<p>Back to Student Dashboard</p>';
        break;
      case 'aadhaar-go-btn':
        var aadhaar = document.getElementById('aadhaar-number').value;
        var registered = aadhaar === '999988887777';
        document.getElementById('aadhaar-registered').hidden = !registered;
        document.getElementById('aadhaar-not-registered').hidden = registered;
        break;
      case 'view-details-btn':
        show('track-by-details');
        break;
      case 'global-search-nav-btn':
        show('global-search');
        break;
      case 'gs-search-btn':
        document.getElementById('gs-result').hidden = false;
        break;
      case 'hos-details-btn':
        // Removed (not just hidden) so it can never collide with the
        // modal's own "HOS Details" heading under exact-text matching —
        // Playwright's get_by_text/get_by_label do not filter out merely
        // `hidden` elements, only ones absent from the DOM.
        e.target.remove();
        document.getElementById('hos-details-modal').hidden = false;
        break;
      case 'nav-release-management-btn':
        show('release-menu');
        break;
      case 'release-generate-nav-btn':
        show('release-generate');
        break;
      case 'release-sent-nav-btn':
        show('sent-requests');
        break;
      case 'rel-get-details-btn':
        document.getElementById('rel-basic-details').hidden = false;
        break;
      case 'rel-generate-btn':
        document.getElementById('rel-confirm-dialog').hidden = false;
        break;
      case 'rel-cancel-btn':
        document.getElementById('rel-confirm-dialog').hidden = true;
        break;
      case 'rel-confirm-btn':
        document.getElementById('rel-confirm-dialog').remove();
        document.getElementById('rel-success').hidden = false;
        break;
      case 'student-details-btn':
        e.target.remove();
        document.getElementById('student-details-modal').hidden = false;
        break;
    }
  });
</script>
</body>
</html>
